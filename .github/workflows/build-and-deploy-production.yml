name: Deploy Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Job 1: Build & Push Docker Image to GHCR
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=main

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 2: Deploy via Hostinger Docker Manager API
  # ==========================================
  deploy:
    name: Deploy to Production (Hostinger)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_NAME: ${{ github.event.repository.name }}-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Substitute environment variables in docker-compose.yml
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_REGION: ${{ vars.RIOT_REGION }}
          RIOT_PLATFORM: ${{ vars.RIOT_PLATFORM }}
          POLLING_INTERVAL_MINUTES: ${{ vars.POLLING_INTERVAL_MINUTES }}
          POLLING_DELAY_MS: ${{ vars.POLLING_DELAY_MS }}
        run: |
          envsubst < infra/prod/docker-compose.yml > /tmp/docker-compose-deploy.yml

      - name: Deploy Docker project on Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
        run: |
          COMPOSE_CONTENT=$(cat /tmp/docker-compose-deploy.yml)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/${HOSTINGER_VPS_ID}/docker" \
            -H "Authorization: Bearer ${HOSTINGER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"project_name\": \"${{ env.PROJECT_NAME }}\",
              \"content\": $(echo "$COMPOSE_CONTENT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),
              \"environment\": \"DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}\nDISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}\nRIOT_API_KEY=${{ secrets.RIOT_API_KEY }}\"
            }")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "❌ Falha ao criar projeto. Status: $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Projeto '${{ env.PROJECT_NAME }}' criado/atualizado com sucesso!"
