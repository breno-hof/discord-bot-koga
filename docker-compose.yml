version: "3.8"
services:
  koga-bot:
    build: .
    image: ghcr.io/breno-hof/discord-bot-koga:main
    container_name: koga-bot
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
      - koga-data:/app/data
    environment:
      - NODE_ENV=production

volumes:
  koga-data:
    driver: local
