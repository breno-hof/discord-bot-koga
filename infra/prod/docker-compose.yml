version: "3.8"
services:
  koga-bot:
    image: ghcr.io/devyor-dot-fun/discord-bot-koga:main
    container_name: koga-bot
    restart: unless-stopped
    volumes:
      - koga-data:/app/data
    environment:
      - NODE_ENV=production
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - RIOT_API_KEY=${RIOT_API_KEY}
      - RIOT_REGION=${RIOT_REGION:-americas}
      - RIOT_PLATFORM=${RIOT_PLATFORM:-br1}
      - DATABASE_PATH=data/koga.db
      - POLLING_INTERVAL_MINUTES=${POLLING_INTERVAL_MINUTES:-5}
      - POLLING_DELAY_MS=${POLLING_DELAY_MS:-1500}

volumes:
  koga-data:
    driver: local
