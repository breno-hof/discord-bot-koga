version: "3.8"
services:
  koga-bot:
    image: ghcr.io/breno-hof/discord-bot-koga:main
    container_name: koga-bot
    restart: unless-stopped
    volumes:
      - koga-data2:/app/data
    environment:
      - NODE_ENV=production
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - RIOT_API_KEY=${RIOT_API_KEY}
      - RIOT_REGION=${RIOT_REGION}
      - DATABASE_PATH=data/koga.db
      - POLLING_INTERVAL_MINUTES=${POLLING_INTERVAL_MINUTES}
      - POLLING_DELAY_MS=${POLLING_DELAY_MS}

volumes:
  koga-data2:
    driver: local
